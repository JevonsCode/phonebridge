<!doctype html><html lang="__LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhoneBridge</title><style>
:root{font:16px system-ui,"Segoe UI",sans-serif;color:#17334d;background:#f3f7fb;--blue:#2468db}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:48px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:32px}.brand{font-size:26px;font-weight:700;color:var(--blue)}button,select{font:inherit;border-radius:12px;border:1px solid #dbe4ef;background:white;padding:11px 16px;color:#17334d;cursor:pointer}button.primary{background:var(--blue);color:white;border:0}.panel{background:white;border-radius:24px;padding:32px;margin:20px 0}h1{font-size:34px;letter-spacing:-.6px;margin:0 0 12px}p{line-height:1.65;color:#5b6d81}.row{display:flex;align-items:center;gap:32px}.qr{width:300px;max-width:100%;border:1px solid #edf1f7;border-radius:16px}.status{display:inline-flex;align-items:center;gap:9px;padding:10px 14px;background:#edf4ff;border-radius:30px;color:var(--blue)}.dot{width:9px;height:9px;border-radius:50%;background:currentColor}.muted{font-size:14px;color:#6c7e91}#error{color:#ad402f}details{margin-top:24px}select{max-width:100%;margin:12px 8px 12px 0}.footer{font-size:13px;color:#7d8da0;margin:24px 8px}a{color:var(--blue)}@media(max-width:700px){main{margin-top:24px}.panel{padding:24px}.row{flex-direction:column;align-items:flex-start}h1{font-size:28px}.qr{width:280px}}
</style></head><body data-base="__BASE__"><main><header><span class="brand">↔ PhoneBridge</span><button id="language">English / 中文</button></header><section class="panel"><div class="status"><span class="dot"></span><span id="status"></span></div><h1 id="title" style="margin-top:24px"></h1><p id="intro"></p><div class="row"><img id="qr" class="qr" alt="Private pairing QR"><div><h2 id="stepTitle"></h2><p id="steps"></p><p id="privacy" class="muted"></p><a id="download" href="https://github.com/JevonsCode/phonebridge/releases/tag/v0.6.0" target="_blank" rel="noopener noreferrer"></a></div></div><p id="error" role="alert"></p><button id="start" class="primary"></button><details><summary id="lanTitle"></summary><p id="lanHelp" class="muted"></p><button id="allowLan" class="primary"></button><p id="lanStatus" class="muted" role="status"></p></details><details><summary id="aiTitle"></summary><p id="aiHelp" class="muted"></p><button id="copyMcp" class="primary"></button><p id="copyStatus" class="muted" role="status"></p><pre id="mcpConfig" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#f3f7fb;padding:16px;border-radius:12px"></pre></details><details><summary id="networkTitle"></summary><p id="networkHelp" class="muted"></p><select id="networks" aria-label="Network"></select><button id="change"></button><p id="address" class="muted"></p></details></section><p id="footer" class="footer"></p></main><script src="__BASE__/app.js"></script></body></html>
