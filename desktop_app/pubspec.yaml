name: phonebridge_desktop
description: PhoneBridge desktop companion.
publish_to: none
version: 0.7.1+2025
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  tray_manager: ^0.5.3
  window_manager: ^0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/brand/tray.ico
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
